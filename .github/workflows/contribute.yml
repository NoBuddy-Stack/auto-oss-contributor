name: Auto OSS Contributor

on:
  schedule:
    - cron: '0 8 * * *' # Daily at 8 AM UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  contribute:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialize data directory
        run: |
          mkdir -p data
          if [ ! -f data/contributions.json ]; then
            echo '[]' > data/contributions.json
          fi

      - name: Run pipeline
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: node src/index.js --stage=all

      - name: Commit dashboard updates
        env:
          GIT_AUTHOR_NAME: "Auto OSS Contributor"
          GIT_AUTHOR_EMAIL: "auto-oss-contributor@users.noreply.github.com"
          GIT_COMMITTER_NAME: "Auto OSS Contributor"
          GIT_COMMITTER_EMAIL: "auto-oss-contributor@users.noreply.github.com"
        run: |
          git add data/ README.md
          git diff --staged --quiet || git commit -m "chore: update contribution dashboard"
          git push
