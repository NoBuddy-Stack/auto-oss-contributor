name: PR Review Responder

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  respond-to-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Handle pending reviews
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: node src/index.js --stage=reviews

      - name: Update dashboard
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node src/index.js --stage=dashboard

      - name: Commit updates
        env:
          GIT_AUTHOR_NAME: Auto OSS Contributor
          GIT_AUTHOR_EMAIL: auto-oss-contributor@users.noreply.github.com
          GIT_COMMITTER_NAME: Auto OSS Contributor
          GIT_COMMITTER_EMAIL: auto-oss-contributor@users.noreply.github.com
        run: |
          git add data/ README.md
          git diff --staged --quiet || git commit -m "chore: update contribution statuses"
          git push
